version: '3'

vars:
  DRY_RUN: '{{default "false" .DRY_RUN}}'
  DOTFILES_HOME: '{{default "$HOME/.dotfiles" .DOTFILES_HOME}}'
  DOTFILES_SRC: '{{default (printf "%s/dotfiles" .TASKFILE_DIR) .DOTFILES_SRC}}'
  ITERM2_SRC: '{{default "iterm2/com.googlecode.iterm2.plist" .ITERM2_SRC}}'
  ITERM2_DEST: '{{default "$HOME/Library/Preferences/com.googlecode.iterm2.plist" .ITERM2_DEST}}'
  CLAUDE_SRC: '{{default "claude" .CLAUDE_SRC}}'
  CLAUDE_DEST: '{{default "$HOME/.claude" .CLAUDE_DEST}}'
  SKILLS_SRC: '{{default (printf "%s/skills" .CLAUDE_SRC) .SKILLS_SRC}}'
  SKILLS_DEST: '{{default (printf "%s/skills" .CLAUDE_DEST) .SKILLS_DEST}}'
  CHAT_SKILLS_SRC: '{{default (printf "%s/claude/skills-chat" .TASKFILE_DIR) .CHAT_SKILLS_SRC}}'
  CHAT_SKILLS_OUT: '{{default (printf "%s/dist/skills-chat" .TASKFILE_DIR) .CHAT_SKILLS_OUT}}'
  HERDR_SRC: '{{default "claude/herdr/config.toml" .HERDR_SRC}}'
  HERDR_DEST: '{{default "$HOME/.config/herdr/config.toml" .HERDR_DEST}}'
  DAILY_NOTE_SRC: '{{default "daily-note" .DAILY_NOTE_SRC}}'
  VAULT_DEST: '{{default "$HOME/Library/Mobile Documents/iCloud~md~obsidian/Documents/work" .VAULT_DEST}}'
  CLAUDE_DESKTOP_CONFIG: '{{default "$HOME/Library/Application Support/Claude/claude_desktop_config.json" .CLAUDE_DESKTOP_CONFIG}}'
  THINGS_MCP_VERSION: '{{default "0.8.1" .THINGS_MCP_VERSION}}'
  WISPR_VERSION: '{{default "0.1.3" .WISPR_VERSION}}'

silent: true

tasks:
  default:
    desc: Alias for `task init`
    deps:
      - init

  help:
    desc: List all available tasks
    cmds:
      - task --list

  "dry-run":
    desc: Preview what `task init` would do without making changes
    cmds:
      - task init DRY_RUN=true

  init:
    desc: Run full bootstrap (prereqs → brew install/upgrade → dotfiles)
    cmds:
      - task: brew:bundle        # brew:bundle deps bootstrap:prereqs — runs it once
      - task: brew:upgrade
      - task: dotfiles:sync
      - task: tools:zshrc
      - task: config:git
      - task: tools:iterm2
      - task: tools:p10k
      - task: tools:tmux
      - task: tools:dev-script
      - task: tools:claude
      - task: tools:claude-skills
      - task: tools:herdr
      - task: tools:node

  "bootstrap:prereqs":
    desc: Ensure oh-my-zsh and Homebrew are installed
    cmds:
      - |
        set -euo pipefail
        ZSH_CUSTOM="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}"
        if [ "{{.DRY_RUN}}" = "true" ]; then
          [ -d "$HOME/.oh-my-zsh" ] \
            && echo "[ok] oh-my-zsh: already installed" \
            || echo "[change] oh-my-zsh: would install"
          command -v brew >/dev/null 2>&1 \
            && echo "[ok] Homebrew: already installed" \
            || echo "[change] Homebrew: would install"
          [ -d "$HOME/.tmux/plugins/tpm" ] \
            && echo "[ok] tpm: already present" \
            || echo "[change] tpm: would clone"
          [ -d "$ZSH_CUSTOM/plugins/zsh-autosuggestions" ] \
            && echo "[ok] zsh-autosuggestions: already present" \
            || echo "[change] zsh-autosuggestions: would clone"
          [ -d "$ZSH_CUSTOM/plugins/zsh-syntax-highlighting" ] \
            && echo "[ok] zsh-syntax-highlighting: already present" \
            || echo "[change] zsh-syntax-highlighting: would clone"
        else
          if [ ! -d "$HOME/.oh-my-zsh" ]; then
            echo "[bootstrap] Installing oh-my-zsh"
            RUNZSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
          else
            echo "[bootstrap] oh-my-zsh already installed"
          fi
          if command -v brew >/dev/null 2>&1; then
            echo "[bootstrap] Homebrew already installed"
          else
            echo "[bootstrap] Installing Homebrew"
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          if [ ! -d "$HOME/.tmux/plugins/tpm" ]; then
            echo "[bootstrap] Cloning tpm (tmux plugin manager)"
            git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm"
          else
            echo "[bootstrap] tpm already present"
          fi
          if [ ! -d "$ZSH_CUSTOM/plugins/zsh-autosuggestions" ]; then
            echo "[bootstrap] Cloning zsh-autosuggestions"
            git clone https://github.com/zsh-users/zsh-autosuggestions "$ZSH_CUSTOM/plugins/zsh-autosuggestions"
          else
            echo "[bootstrap] zsh-autosuggestions already present"
          fi
          if [ ! -d "$ZSH_CUSTOM/plugins/zsh-syntax-highlighting" ]; then
            echo "[bootstrap] Cloning zsh-syntax-highlighting"
            git clone https://github.com/zsh-users/zsh-syntax-highlighting "$ZSH_CUSTOM/plugins/zsh-syntax-highlighting"
          else
            echo "[bootstrap] zsh-syntax-highlighting already present"
          fi
        fi

  "brew:bundle":
    desc: Install packages defined in Brewfile
    deps:
      - "bootstrap:prereqs"
    cmds:
      - |
        set -euo pipefail
        # hashicorp/tap/terraform lives in a non-official tap. Machines with
        # HOMEBREW_REQUIRE_TAP_TRUST enabled refuse to load it until explicitly
        # trusted. Trust is scoped to this one formula (not the whole tap) per
        # security review — least privilege. `brew trust --formula` is
        # idempotent: it exits 0 and no-ops if already trusted.
        if [ "{{.DRY_RUN}}" != "true" ]; then
          echo "[brew] Trusting hashicorp/tap/terraform formula"
          brew trust --formula hashicorp/tap/terraform
        fi
        if [ "{{.DRY_RUN}}" = "true" ]; then
          if HOMEBREW_NO_AUTO_UPDATE=1 brew bundle check --file Brewfile >/dev/null 2>&1; then
            echo "[ok] brew bundle: all packages satisfied"
          else
            missing=$(HOMEBREW_NO_AUTO_UPDATE=1 brew bundle check --file Brewfile 2>&1 \
              | grep -cE '^\s*(brew|cask|mas|tap):' || true)
            echo "[change] brew bundle: $missing package(s) would be installed"
          fi
          outdated=$(HOMEBREW_NO_AUTO_UPDATE=1 brew outdated --quiet 2>/dev/null | wc -l | tr -d ' ')
          if [ "$outdated" -gt 0 ]; then
            echo "[change] brew outdated: $outdated package(s) have updates available"
            HOMEBREW_NO_AUTO_UPDATE=1 brew outdated --quiet 2>/dev/null | sed 's/^/  /'
          else
            echo "[ok] brew outdated: all packages up to date"
          fi
        else
          echo "[brew] Running brew bundle"
          brew bundle --file Brewfile
        fi
    sources:
      - Brewfile
    generates:
      - Brewfile.lock.json

  "brew:upgrade":
    desc: Upgrade outdated Homebrew formulae (casks are handled manually)
    deps:
      - "bootstrap:prereqs"
    cmds:
      - |
        set -euo pipefail
        if [ "{{.DRY_RUN}}" = "true" ]; then
          outdated=$(HOMEBREW_NO_AUTO_UPDATE=1 brew outdated --formula --quiet 2>/dev/null | wc -l | tr -d ' ')
          if [ "$outdated" -gt 0 ]; then
            echo "[change] brew upgrade: $outdated formula(e) would be upgraded"
            HOMEBREW_NO_AUTO_UPDATE=1 brew outdated --formula --quiet 2>/dev/null | sed 's/^/  /'
          else
            echo "[ok] brew upgrade: nothing to upgrade"
          fi
        else
          echo "[brew] Upgrading outdated formulae"
          brew upgrade --formula
        fi

  "brew:dump":
    desc: Refresh Brewfile from current system state
    cmds:
      - |
        set -euo pipefail
        if [ "{{.DRY_RUN}}" = "true" ]; then
          echo "[dry-run] Would regenerate Brewfile"
        else
          echo "[brew] Dumping Brewfile"
          brew bundle dump --file Brewfile --force
        fi

  "dotfiles:sync":
    desc: Copy dotfiles config into ~/.dotfiles
    cmds:
      - |
        set -euo pipefail
        if [ "{{.DRY_RUN}}" = "true" ]; then
          for f in config.sh gitconfig; do
            src_file="{{.DOTFILES_SRC}}/$f"
            dest_file="{{.DOTFILES_HOME}}/$f"
            if [ ! -f "$dest_file" ]; then
              echo "[change] dotfiles/$f: would create (not present)"
            elif cmp -s "$src_file" "$dest_file"; then
              echo "[ok] dotfiles/$f: identical"
            else
              echo "[change] dotfiles/$f: would update"
            fi
          done
        else
          echo "[dotfiles] Syncing to {{.DOTFILES_HOME}}"
          mkdir -p {{.DOTFILES_HOME}}
          rsync -a {{.DOTFILES_SRC}}/config.sh {{.DOTFILES_HOME}}/config.sh
          rsync -a {{.DOTFILES_SRC}}/gitconfig {{.DOTFILES_HOME}}/gitconfig
        fi
    sources:
      - "{{.DOTFILES_SRC}}/config.sh"
      - "{{.DOTFILES_SRC}}/gitconfig"

  "dotfiles:pull":
    desc: Copy home dotfiles back into repo for editing
    cmds:
      - |
        set -euo pipefail
        if [ "{{.DRY_RUN}}" = "true" ]; then
          echo "[dry-run] Would copy from {{.DOTFILES_HOME}} back to repo"
        else
          echo "[dotfiles] Pulling from {{.DOTFILES_HOME}}"
          rsync -a {{.DOTFILES_HOME}}/config.sh {{.DOTFILES_SRC}}/config.sh
          rsync -a {{.DOTFILES_HOME}}/gitconfig {{.DOTFILES_SRC}}/gitconfig
        fi

  "tools:zshrc":
    desc: Copy zshrc into ~/.zshrc
    cmds:
      - |
        set -euo pipefail
        SRC="{{.DOTFILES_SRC}}/.zshrc"
        TARGET="$HOME/.zshrc"
        if [ "{{.DRY_RUN}}" = "true" ]; then
          if [ ! -f "$TARGET" ]; then
            echo "[change] .zshrc: would create (not present)"
          elif cmp -s "$SRC" "$TARGET"; then
            echo "[ok] .zshrc: identical"
          else
            echo "[change] .zshrc: would update"
          fi
        else
          echo "[shell] Copying $SRC to $TARGET"
          install -m 0644 "$SRC" "$TARGET"
        fi

  "tools:tmux":
    desc: Install .tmux.conf into ~/.tmux.conf
    cmds:
      - |
        set -euo pipefail
        SRC="{{.DOTFILES_SRC}}/.tmux.conf"
        TARGET="$HOME/.tmux.conf"
        if [ "{{.DRY_RUN}}" = "true" ]; then
          if [ ! -f "$TARGET" ]; then
            echo "[change] .tmux.conf: would create (not present)"
          elif cmp -s "$SRC" "$TARGET"; then
            echo "[ok] .tmux.conf: identical"
          else
            echo "[change] .tmux.conf: would update"
          fi
        else
          echo "[tmux] Installing $SRC to $TARGET"
          install -m 0644 "$SRC" "$TARGET"
        fi

  "tools:p10k":
    desc: Install .p10k.zsh config into ~/.p10k.zsh
    cmds:
      - |
        set -euo pipefail
        SRC="{{.DOTFILES_SRC}}/.p10k.zsh"
        TARGET="$HOME/.p10k.zsh"
        if [ ! -f "$SRC" ]; then
          echo "[p10k] No .p10k.zsh in dotfiles yet; skipping (run the p10k wizard then commit it)"
          exit 0
        fi
        if [ "{{.DRY_RUN}}" = "true" ]; then
          if [ ! -f "$TARGET" ]; then
            echo "[change] .p10k.zsh: would create (not present)"
          elif cmp -s "$SRC" "$TARGET"; then
            echo "[ok] .p10k.zsh: identical"
          else
            echo "[change] .p10k.zsh: would update"
          fi
        else
          echo "[p10k] Installing $SRC to $TARGET"
          install -m 0644 "$SRC" "$TARGET"
        fi

  "config:git":
    desc: Install base gitconfig + per-identity includes + allowed_signers
    cmds:
      - |
        set -euo pipefail
        SRC="{{.DOTFILES_SRC}}"
        if [ "{{.DRY_RUN}}" = "true" ]; then
          for pair in \
            "gitconfig:$HOME/.gitconfig" \
            "gitconfig-liatrio:$HOME/.gitconfig-liatrio" \
            "gitconfig-personal:$HOME/.gitconfig-personal" \
            "allowed_signers:$HOME/.ssh/allowed_signers"; do
            src_file="${pair%%:*}"
            dest_file="${pair##*:}"
            label="$(basename "$dest_file")"
            if [ ! -f "$dest_file" ]; then
              echo "[change] $label: would create (not present)"
            elif cmp -s "$SRC/$src_file" "$dest_file"; then
              echo "[ok] $label: identical"
            else
              echo "[change] $label: would update"
            fi
          done
        else
          echo "[identities] Installing base gitconfig"
          install -m 0644 "$SRC/gitconfig" "$HOME/.gitconfig"
          echo "[identities] Installing per-identity includes"
          install -m 0644 "$SRC/gitconfig-liatrio" "$HOME/.gitconfig-liatrio"
          install -m 0644 "$SRC/gitconfig-personal" "$HOME/.gitconfig-personal"
          echo "[identities] Installing allowed_signers"
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          install -m 0644 "$SRC/allowed_signers" "$HOME/.ssh/allowed_signers"
        fi

  "tools:iterm2":
    desc: Install iTerm2 preferences plist
    cmds:
      - |
        set -euo pipefail
        src="{{.ITERM2_SRC}}"
        dest="{{.ITERM2_DEST}}"
        if [ ! -f "$src" ]; then
          echo "[tools] iTerm2 source $src not found; skipping"
          exit 0
        fi
        if [ "{{.DRY_RUN}}" = "true" ]; then
          if [ ! -f "$dest" ]; then
            echo "[change] iterm2 plist: would create (not present)"
          elif cmp -s "$src" "$dest"; then
            echo "[ok] iterm2 plist: identical"
          else
            echo "[change] iterm2 plist: would update"
          fi
          exit 0
        fi
        mkdir -p "$(dirname "$dest")"
        install -m 0600 "$src" "$dest"
        echo "[tools] Installed iTerm2 preferences to $dest"

  "tools:dev-script":
    desc: Install dev workspace startup script to ~/.local/bin/dev
    cmds:
      - |
        set -euo pipefail
        SRC="{{.DOTFILES_SRC}}/dev"
        TARGET="$HOME/.local/bin/dev"
        if [ "{{.DRY_RUN}}" = "true" ]; then
          if [ ! -f "$TARGET" ]; then
            echo "[change] dev: would create (not present)"
          elif cmp -s "$SRC" "$TARGET"; then
            echo "[ok] dev: identical"
          else
            echo "[change] dev: would update"
          fi
        else
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$SRC" "$TARGET"
          echo "[dev] Installed workspace startup script to $TARGET"
        fi

  "tools:claude":
    desc: Sync Claude config, agents, and commands into place
    cmds:
      - |
        set -euo pipefail
        src="{{.CLAUDE_SRC}}"
        dest="{{.CLAUDE_DEST}}"
        if [ "{{.DRY_RUN}}" = "true" ]; then
          for f in CLAUDE.md charter-details.md settings.json statusline-command.sh; do
            if [ ! -f "$dest/$f" ]; then
              echo "[change] $f: would create (not present)"
            elif cmp -s "$src/$f" "$dest/$f"; then
              echo "[ok] $f: identical"
            else
              echo "[change] $f: would update"
            fi
          done
          if [ -d "$dest/agents" ]; then
            changes=$(rsync -a --delete-after --dry-run --itemize-changes \
              --filter='P .DS_Store' "$src/agents/" "$dest/agents/" 2>/dev/null \
              | grep -v '^$' | wc -l | tr -d ' ') || true
            if [ "$changes" -eq 0 ]; then
              echo "[ok] agents/: no changes"
            else
              echo "[change] agents/: $changes file(s) would change"
              rsync -a --delete-after --dry-run --itemize-changes \
                --filter='P .DS_Store' "$src/agents/" "$dest/agents/" 2>/dev/null \
                | grep -v '^$' | sed 's/^/  /'
            fi
          else
            echo "[change] agents/: would create and populate"
          fi
          if [ -d "$src/commands" ]; then
            if [ -d "$dest/commands" ]; then
              changes=$(rsync -a --dry-run --itemize-changes \
                --filter='P .DS_Store' "$src/commands/" "$dest/commands/" 2>/dev/null \
                | grep -v '^$' | wc -l | tr -d ' ') || true
              if [ "$changes" -eq 0 ]; then
                echo "[ok] commands/: no changes"
              else
                echo "[change] commands/: $changes file(s) would change"
                rsync -a --dry-run --itemize-changes \
                  --filter='P .DS_Store' "$src/commands/" "$dest/commands/" 2>/dev/null \
                  | grep -v '^$' | sed 's/^/  /'
              fi
            else
              echo "[change] commands/: would create and populate"
            fi
          fi
          exit 0
        fi
        mkdir -p "$dest"
        install -m 0644 "$src/CLAUDE.md" "$dest/CLAUDE.md"
        install -m 0644 "$src/charter-details.md" "$dest/charter-details.md"
        install -m 0644 "$src/settings.json" "$dest/settings.json"
        install -m 0755 "$src/statusline-command.sh" "$dest/statusline-command.sh"
        echo "[claude] Installed config files to $dest"
        # agents/ is a mirror — --delete prunes agents removed from the repo.
        mkdir -p "$dest/agents/"
        rsync -a --delete-after --filter='P .DS_Store' "$src/agents/" "$dest/agents/"
        echo "[claude] Synced agents/ (mirror) to $dest/agents/"
        # commands/ is ADDITIVE — no --delete; SDD-* commands live here from elsewhere.
        if [ -d "$src/commands" ]; then
          mkdir -p "$dest/commands/"
          rsync -a --filter='P .DS_Store' "$src/commands/" "$dest/commands/"
          echo "[claude] Synced commands/ (additive) to $dest/commands/"
        fi

  "tools:claude-skills":
    desc: Sync Claude skills into ~/.claude/skills (additive top-level, per-skill mirror)
    cmds:
      - |
        set -euo pipefail
        src="{{.SKILLS_SRC}}"
        dest="{{.SKILLS_DEST}}"
        # ~/.claude/skills/ is co-tenanted with skills this repo does not own:
        # real directories (agent-browser, frontend-design, sdd,
        # web-design-guidelines) and symlinks to ~/.agents/skills/* (grill-me,
        # grill-with-docs, grilling, handoff). A bulk mirror like agents/ below
        # would delete all of those the moment they're absent from this repo.
        # So this task is ADDITIVE at the top level — it only ever touches
        # entries that exist under claude/skills/ in the repo — and mirrors
        # (--delete) only WITHIN each individual repo-owned skill directory,
        # since the repo is authoritative for that one skill's own contents.
        [ -d "$src" ] || { echo "[claude-skills] No $src directory; skipping"; exit 0; }
        if [ "{{.DRY_RUN}}" = "true" ]; then
          for d in "$src"/*/; do
            [ -e "$d" ] || continue
            name="$(basename "$d")"
            if [ -L "$dest/$name" ]; then
              echo "[change] $name: would replace symlink with directory"
              continue
            fi
            if [ -d "$dest/$name" ]; then
              changes=$(rsync -a --delete --dry-run --itemize-changes \
                --filter='P .DS_Store' "$d" "$dest/$name/" 2>/dev/null \
                | grep -v '^$' | wc -l | tr -d ' ') || true
              if [ "$changes" -eq 0 ]; then
                echo "[ok] $name: no changes"
              else
                echo "[change] $name: $changes file(s) would change"
                rsync -a --delete --dry-run --itemize-changes \
                  --filter='P .DS_Store' "$d" "$dest/$name/" 2>/dev/null \
                  | grep -v '^$' | sed 's/^/  /'
              fi
            else
              echo "[change] $name: would create (not present)"
            fi
          done
          exit 0
        fi
        mkdir -p "$dest"
        for d in "$src"/*/; do
          [ -e "$d" ] || continue
          name="$(basename "$d")"
          if [ -L "$dest/$name" ]; then
            echo "[claude-skills] Removing symlink at $dest/$name (repo now owns this skill)"
            rm "$dest/$name"
          fi
          mkdir -p "$dest/$name"
          rsync -a --delete --filter='P .DS_Store' "$d" "$dest/$name/"
          echo "[claude-skills] Synced $name/ to $dest/$name/"
        done

  "tools:claude-skills-external":
    desc: Install external (non-vendored) Claude Code skills via npx skills add
    cmds:
      - |
        set -euo pipefail
        # These skills are installed straight from third-party repos via the
        # vercel-labs/skills npx CLI — they are NOT vendored into claude/skills/
        # in this repo (see tools:claude-skills for repo-owned skills). Agent
        # flags below were derived from `npx skills list -g --json` on this
        # machine and reflect what's actually live; do not change them without
        # re-verifying against that output.
        cmds=(
          "npx skills add anthropics/skills --skill skill-creator -g -a claude-code -y"
          "npx skills add shadcn/improve -g -a claude-code -y"
          "npx skills add liatrio-labs/spec-driven-workflow -g -a claude-code -y"
          "npx skills add vercel-labs/agent-browser -g -a claude-code -a cursor -a github-copilot -a zed -y"
          "npx skills add anthropics/claude-code --skill frontend-design -g -a claude-code -a cursor -a github-copilot -a zed -y"
          "npx skills add vercel-labs/agent-skills --skill web-design-guidelines -g -a claude-code -a cursor -a github-copilot -a zed -y"
          "npx skills add mattpocock/skills --skill grill-me -g -a claude-code -a cursor -a devin -a github-copilot -a windsurf -a zed -y"
          "npx skills add mattpocock/skills --skill grill-with-docs -g -a claude-code -a cursor -a devin -a github-copilot -a windsurf -a zed -y"
          "npx skills add mattpocock/skills --skill grilling -g -a claude-code -a cursor -a devin -a github-copilot -a windsurf -a zed -y"
        )
        if [ "{{.DRY_RUN}}" = "true" ]; then
          for c in "${cmds[@]}"; do
            echo "[dry-run] $c"
          done
          exit 0
        fi
        for c in "${cmds[@]}"; do
          echo "[claude-skills-external] Running: $c"
          eval "$c"
        done
        echo "[claude-skills-external] Done. See docs/external-skills.md for the full list."

  "tools:claude-skills-chat-zip":
    desc: Zip chat-variant skills for manual upload to claude.ai / Claude Desktop
    cmds:
      - |
        set -euo pipefail
        # skills-chat/ holds claude.ai-chat / Claude Desktop variants of the
        # Claude Code skills in claude/skills/. These are never synced to
        # ~/.claude (tools:claude-skills does not pick this directory up) —
        # they're uploaded manually via Settings → Capabilities → Skills,
        # which accepts a zip whose top-level folder contains SKILL.md.
        # Not part of the `init` chain: upload is a manual step.
        src="{{.CHAT_SKILLS_SRC}}"
        out="{{.CHAT_SKILLS_OUT}}"
        [ -d "$src" ] || { echo "[claude-skills-chat-zip] No $src directory; skipping"; exit 0; }
        if [ "{{.DRY_RUN}}" = "true" ]; then
          for d in "$src"/*/; do
            [ -e "$d" ] || continue
            name="$(basename "$d")"
            echo "[change] $name: would zip → dist/skills-chat/$name.zip"
          done
          exit 0
        fi
        mkdir -p "$out"
        for d in "$src"/*/; do
          [ -e "$d" ] || continue
          name="$(basename "$d")"
          rm -f "$out/$name.zip"
          ( cd "$src" && zip -r -X "$out/$name.zip" "$name" -x '*.DS_Store' >/dev/null )
          echo "[claude-skills-chat-zip] Zipped $name/ to $out/$name.zip"
        done

  "tools:herdr":
    desc: Sync herdr config into place
    cmds:
      - |
        set -euo pipefail
        SRC="{{.HERDR_SRC}}"
        DEST="{{.HERDR_DEST}}"
        if [ "{{.DRY_RUN}}" = "true" ]; then
          if [ ! -f "$DEST" ]; then
            echo "[change] herdr config: would create (not present)"
          elif cmp -s "$SRC" "$DEST"; then
            echo "[ok] herdr config: identical"
          else
            echo "[change] herdr config: would update"
          fi
        else
          mkdir -p "$(dirname "$DEST")"
          chmod 700 "$(dirname "$DEST")"
          install -m 0644 "$SRC" "$DEST"
          echo "[herdr] Installed config to $DEST"
        fi

  "tools:node":
    desc: Install LTS Node via NVM and global npm packages (agent-browser, lavish-axi)
    cmds:
      - |
        set -euo pipefail
        if [ "{{.DRY_RUN}}" = "true" ]; then
          # Source nvm and check state inside a real bash subprocess — mvdan.cc/sh
          # (task's embedded interpreter) panics on fd 3 which nvm opens internally.
          nvm_info=$(bash -c '
            export NVM_DIR="$HOME/.nvm"
            [ -s "/opt/homebrew/opt/nvm/nvm.sh" ] && . "/opt/homebrew/opt/nvm/nvm.sh"
            if command -v nvm >/dev/null 2>&1; then
              lts_ver=$(nvm version lts 2>/dev/null || echo "N/A")
              echo "nvm:$lts_ver"
            else
              echo "nvm:missing"
            fi
            npm list -g agent-browser >/dev/null 2>&1 \
              && echo "agent-browser:ok" \
              || echo "agent-browser:missing"
            npm list -g lavish-axi >/dev/null 2>&1 \
              && echo "lavish-axi:ok" \
              || echo "lavish-axi:missing"
          ' 2>/dev/null || true)
          case "$nvm_info" in
            *"nvm:missing"*)  echo "[change] node: nvm not found, would need Homebrew install first" ;;
            *"nvm:N/A"*)      echo "[change] node: LTS not installed, would run nvm install --lts" ;;
            *)
              lts_ver=$(printf '%s' "$nvm_info" | grep "^nvm:" | cut -d: -f2)
              echo "[ok] node: LTS ($lts_ver) already installed" ;;
          esac
          case "$nvm_info" in
            *"agent-browser:ok"*)      echo "[ok] agent-browser: already installed globally" ;;
            *"agent-browser:missing"*) echo "[change] agent-browser: would install globally" ;;
          esac
          case "$nvm_info" in
            *"lavish-axi:ok"*)      echo "[ok] lavish-axi: already installed globally" ;;
            *"lavish-axi:missing"*) echo "[change] lavish-axi: would install globally" ;;
          esac
        else
          echo "[node] Installing LTS Node via NVM"
          bash -c '
            export NVM_DIR="$HOME/.nvm"
            [ -s "/opt/homebrew/opt/nvm/nvm.sh" ] && . "/opt/homebrew/opt/nvm/nvm.sh"
            nvm install --lts
            nvm use --lts
            echo "[node] Installing global npm packages"
            npm install -g agent-browser
            npm install -g lavish-axi
            echo "[node] Node setup complete"
          '
        fi

  "daily-note":
    desc: "Set up the Obsidian daily-note system (vault files, Wispr plugin, Things MCP). OPT-IN, work Mac only; not part of `task init`"
    cmds:
      - task: "daily-note:vault"
      - task: "daily-note:wispr-plugin"
      - task: "daily-note:things-mcp"

  "daily-note:vault":
    desc: Install daily-note template, helper script, Obsidian settings, and plugin configs into the work vault
    cmds:
      - |
        set -euo pipefail
        SRC="{{.DAILY_NOTE_SRC}}/vault"
        DEST="{{.VAULT_DEST}}"
        DRY="{{.DRY_RUN}}"
        if [ ! -d "$DEST" ]; then
          echo "[error] vault not found: $DEST"
          echo "        pass VAULT_DEST=/path/to/vault"
          exit 1
        fi
        # put LABEL SRC DEST MODE — always converge dest to src
        put() {
          label="$1"; src="$2"; dest="$3"; mode="$4"
          if [ ! -f "$dest" ]; then st=create
          elif cmp -s "$src" "$dest"; then echo "[ok] $label: identical"; return 0
          else st=update; fi
          if [ "$DRY" = "true" ]; then
            echo "[change] $label: would $st"
          else
            mkdir -p "$(dirname "$dest")"
            install -m "$mode" "$src" "$dest"
            echo "[daily-note] $label: ${st}d"
          fi
        }
        put "daily-note-template.md" "$SRC/daily-note-template.md" "$DEST/daily-note-template.md" 0644
        put "daily_note.py" "$SRC/.obsidian/scripts/daily_note.py" "$DEST/.obsidian/scripts/daily_note.py" 0755
        put "daily-notes.json" "$SRC/.obsidian/daily-notes.json" "$DEST/.obsidian/daily-notes.json" 0644
        put "daily-note.local.example.json" "$SRC/.obsidian/scripts/daily-note.local.example.json" "$DEST/.obsidian/scripts/daily-note.local.example.json" 0644

        # wispr data.json stores latestSyncWatermark — seed only when absent
        W="$DEST/.obsidian/plugins/wispr-flow-sync/data.json"
        if [ -f "$W" ]; then
          echo "[ok] wispr-flow-sync data.json: present, preserved"
        elif [ "$DRY" = "true" ]; then
          echo "[change] wispr-flow-sync data.json: would create"
        else
          mkdir -p "$(dirname "$W")"
          install -m 0644 "$SRC/.obsidian/plugins/wispr-flow-sync/data.json" "$W"
          echo "[daily-note] wispr-flow-sync data.json: created"
        fi

        # community-plugins.json: union with the existing array, never drop other plugins
        CP="$DEST/.obsidian/community-plugins.json"
        WANT="$SRC/.obsidian/community-plugins.json"
        if [ ! -f "$CP" ]; then
          if [ "$DRY" = "true" ]; then
            echo "[change] community-plugins.json: would create"
          else
            mkdir -p "$(dirname "$CP")"
            install -m 0644 "$WANT" "$CP"
            echo "[daily-note] community-plugins.json: created"
          fi
        else
          if ! jq -e 'type == "array"' "$CP" >/dev/null 2>&1; then
            echo "[error] $CP is not a JSON array; refusing to modify"
            exit 1
          fi
          merged="$(jq --slurpfile want "$WANT" '. + ($want[0] - .)' "$CP")"
          if [ "$(jq -c . "$CP")" = "$(printf '%s' "$merged" | jq -c .)" ]; then
            echo "[ok] community-plugins.json: already lists required plugins"
          elif [ "$DRY" = "true" ]; then
            echo "[change] community-plugins.json: would add missing plugin ids"
          else
            tmp="$(mktemp "$(dirname "$CP")/.community-plugins.XXXXXX")"
            printf '%s\n' "$merged" > "$tmp"
            jq -e . "$tmp" >/dev/null
            chmod 644 "$tmp"
            mv "$tmp" "$CP"
            echo "[daily-note] community-plugins.json: added missing plugin ids"
          fi
        fi

        # local engagement config: seed from the example only when absent; never overwrite
        L="$DEST/.obsidian/scripts/daily-note.local.json"
        if [ -f "$L" ]; then
          echo "[ok] daily-note.local.json: present, preserved"
        elif [ "$DRY" = "true" ]; then
          echo "[change] daily-note.local.json: would create from example (you must fill it in)"
        else
          install -m 0600 "$SRC/.obsidian/scripts/daily-note.local.example.json" "$L"
          echo "[warn] daily-note.local.json: created from the example with PLACEHOLDER values — edit $L before running the skills"
        fi

        # granola data.json: render the apiKey from the environment; never echo it
        T="$SRC/.obsidian/plugins/granola-sync/data.json.tmpl"
        G="$DEST/.obsidian/plugins/granola-sync/data.json"
        key_present=no
        if [ -n "${GRANOLA_API_KEY:-}" ]; then key_present=yes; fi
        existing_real=no
        if [ -f "$G" ]; then
          ek="$(jq -r '.apiKey // ""' "$G" 2>/dev/null || true)"
          if [ -n "$ek" ] && [ "$ek" != '${GRANOLA_API_KEY}' ]; then existing_real=yes; fi
          ek=""
        fi
        if [ "$existing_real" = "yes" ]; then
          echo "[ok] granola-sync data.json: existing apiKey preserved (not overwritten)"
          if [ "$key_present" = "yes" ]; then
            echo "[warn] granola-sync data.json: GRANOLA_API_KEY ignored; to rotate, clear apiKey in that file and re-run"
          fi
        elif [ "$key_present" = "no" ]; then
          echo "[warn] granola-sync data.json: GRANOLA_API_KEY not set in the environment; skipping (export it and re-run)"
        elif [ "$DRY" = "true" ]; then
          echo "[change] granola-sync data.json: would create (key present: yes)"
        else
          (
            # mktemp creates the file 0600 (task's embedded shell has no umask builtin)
            d="$(dirname "$G")"
            mkdir -p "$d"
            tmp="$(mktemp "$d/.data.json.XXXXXX")"
            trap 'rm -f "$tmp"' EXIT
            jq '.apiKey = $ENV.GRANOLA_API_KEY' "$T" > "$tmp"
            v="$(jq -r '.apiKey // ""' "$tmp")"
            if [ -z "$v" ] || [ "$v" = '${GRANOLA_API_KEY}' ]; then
              echo "[error] granola-sync data.json: rendered apiKey is empty or a placeholder; nothing written"
              exit 1
            fi
            v=""
            chmod 600 "$tmp"
            mv "$tmp" "$G"
            trap - EXIT
          )
          echo "[daily-note] granola-sync data.json: created (mode 600)"
        fi
        if [ "$DRY" != "true" ]; then
          echo "[daily-note] Reload Obsidian (Cmd-R) so plugins re-read data.json; see docs/daily-note.md"
        fi

  "daily-note:wispr-plugin":
    desc: Install the pinned Wispr Flow Sync Obsidian plugin (sha256-verified) into the work vault
    cmds:
      - |
        set -euo pipefail
        VER="{{.WISPR_VERSION}}"
        DEST="{{.VAULT_DEST}}"
        DRY="{{.DRY_RUN}}"
        HASHES="{{.DAILY_NOTE_SRC}}/wispr-flow-sync-$VER.sha256"
        case "$HASHES" in /*) ;; *) HASHES="$PWD/$HASHES" ;; esac
        if [ ! -f "$HASHES" ]; then
          echo "[error] no committed checksums for version $VER: $HASHES"
          echo "        a human must review that release's main.js and commit its sha256 file first"
          exit 1
        fi
        if [ ! -d "$DEST" ]; then
          echo "[error] vault not found: $DEST (pass VAULT_DEST=/path/to/vault)"
          exit 1
        fi
        PDIR="$DEST/.obsidian/plugins/wispr-flow-sync"
        installed="$(jq -r '.version // ""' "$PDIR/manifest.json" 2>/dev/null || true)"
        if [ "$installed" = "$VER" ] && [ -f "$PDIR/main.js" ]; then
          if ( cd "$PDIR" && shasum -a 256 -c "$HASHES" >/dev/null 2>&1 ); then
            echo "[ok] wispr-flow-sync $VER: installed, checksums match"
            exit 0
          fi
          echo "[warn] wispr-flow-sync $VER: installed files do NOT match the committed sha256 (modified or tampered); reinstalling"
        fi
        if [ "$DRY" = "true" ]; then
          echo "[change] wispr-flow-sync $VER: would download, verify sha256, and install to $PDIR"
          exit 0
        fi
        tmpd="$(mktemp -d)"
        trap 'rm -rf "$tmpd"' EXIT
        BASE="https://github.com/madforstrength/obsidian-wispr-flow-sync/releases/download/$VER"
        for f in main.js manifest.json; do
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tmpd/$f" "$BASE/$f"
        done
        if ! ( cd "$tmpd" && shasum -a 256 -c "$HASHES" >/dev/null 2>&1 ); then
          echo "[error] wispr-flow-sync $VER: sha256 mismatch on downloaded files; NOT installing"
          exit 1
        fi
        mkdir -p "$PDIR"
        mv "$tmpd/main.js" "$PDIR/main.js"
        mv "$tmpd/manifest.json" "$PDIR/manifest.json"
        echo "[daily-note] wispr-flow-sync $VER: installed to $PDIR (checksums verified)"

  "daily-note:things-mcp":
    desc: Pin and register the Things 3 MCP server in Claude Desktop config (quit Claude Desktop first)
    cmds:
      - |
        set -euo pipefail
        VER="{{.THINGS_MCP_VERSION}}"
        CFG="{{.CLAUDE_DESKTOP_CONFIG}}"
        DRY="{{.DRY_RUN}}"
        OVERRIDE="{{default "" .THINGSDB}}"
        if [ -z "$OVERRIDE" ]; then OVERRIDE="${THINGSDB:-}"; fi
        UVX="$(command -v uvx)" || { echo "[error] uvx not found (brew install uv; it is in the Brewfile)"; exit 1; }
        if pgrep -x Claude >/dev/null 2>&1; then
          echo "[warn] Claude Desktop appears to be running — quit it (Cmd-Q) before applying; it can overwrite the config on exit"
        fi

        # THINGSDB: override, else the single ThingsData-* folder on this Mac
        if [ -n "$OVERRIDE" ]; then
          DB="$OVERRIDE"
          if [ ! -e "$DB" ]; then echo "[warn] THINGSDB override does not exist: $DB"; fi
        else
          GC="$HOME/Library/Group Containers/JLMPQHK86H.com.culturedcode.ThingsMac"
          matches="$(ls -d "$GC"/ThingsData-*/"Things Database.thingsdatabase/main.sqlite" 2>/dev/null || true)"
          n=0
          if [ -n "$matches" ]; then n="$(printf '%s\n' "$matches" | wc -l | tr -d ' ')"; fi
          if [ "$n" = "1" ]; then
            DB="$matches"
          else
            if [ "$n" = "0" ]; then
              echo "[error] no Things database found (missing, or blocked by macOS privacy): $GC"
              echo "        grant your terminal Full Disk Access, or pass THINGSDB=/full/path/to/main.sqlite"
            else
              echo "[error] $n Things databases found; pass THINGSDB= to choose one:"
              printf '%s\n' "$matches" | sed 's/^/  /'
            fi
            if [ "$DRY" = "true" ]; then
              echo "[change] things-mcp: THINGSDB unresolved (dry-run continues with a placeholder)"
              DB="<unresolved>"
            else
              exit 1
            fi
          fi
        fi

        if [ "$DRY" != "true" ]; then
          echo "[daily-note] Pre-warming things-mcp==$VER (uvx cache)"
          "$UVX" --from "things-mcp==$VER" python -c 'pass' </dev/null
        else
          echo "[change] things-mcp==$VER: would pre-warm the uvx cache"
        fi

        entry="$(jq -n --arg cmd "$UVX" --arg spec "things-mcp==$VER" --arg db "$DB" \
          '{command: $cmd, args: ["--from", $spec, "things-mcp"], env: {THINGSDB: $db}}')"

        if [ -f "$CFG" ]; then
          if ! jq -e 'type == "object" and ((.mcpServers // {}) | type == "object")' "$CFG" >/dev/null 2>&1; then
            echo "[error] $CFG is not a valid JSON object config; aborting without changes"
            exit 1
          fi
          current="$(jq -S -c '.mcpServers.things // null' "$CFG")"
          wanted="$(printf '%s' "$entry" | jq -S -c .)"
          if [ "$current" = "$wanted" ]; then
            echo "[ok] claude_desktop_config.json: mcpServers.things already current"
            status=ok
          else
            status=change
          fi
        else
          status=create
        fi

        if [ "${status:-}" != "ok" ]; then
          if [ "$DRY" = "true" ]; then
            echo "[change] claude_desktop_config.json: would $status mcpServers.things:"
            printf '%s' "$entry" | jq . | sed 's/^/  /'
          else
            if [ "$status" = "create" ]; then
              mkdir -p "$(dirname "$CFG")"
              install -m 0600 /dev/null "$CFG"
              printf '{}\n' > "$CFG"
            fi
            bak="$CFG.bak.$(date +%Y%m%d-%H%M%S)"
            cp -p "$CFG" "$bak"
            chmod 600 "$bak"
            tmp="$(mktemp "$(dirname "$CFG")/.claude_desktop_config.XXXXXX")"
            trap 'rm -f "$tmp"' EXIT
            jq --argjson e "$entry" '.mcpServers = ((.mcpServers // {}) + {things: $e})' "$CFG" > "$tmp"
            jq -e . "$tmp" >/dev/null
            jq -n -e --slurpfile a "$CFG" --slurpfile b "$tmp" \
              'def n: .mcpServers |= ((. // {}) | del(.things)); ($a[0] | n) == ($b[0] | n)' >/dev/null \
              || { echo "[error] merge would change keys other than mcpServers.things; aborting"; exit 1; }
            chmod 600 "$tmp"
            mv "$tmp" "$CFG"
            trap - EXIT
            echo "[daily-note] claude_desktop_config.json: set mcpServers.things (backup: $bak)"
            printf '%s' "$entry" | jq . | sed 's/^/  /'
          fi
        fi

        real_uvx="$(realpath "$UVX" 2>/dev/null || echo "$UVX")"
        echo ""
        echo "[daily-note] Full Disk Access (manual; this task never changes it). Grant in this order and test after each:"
        echo "  1. /Applications/Claude.app"
        echo "  2. only if Things reads still fail (\"unable to open database file\"):"
        echo "     $real_uvx"
        for py in /opt/homebrew/opt/python@*/Frameworks/Python.framework/Versions/*/Resources/Python.app; do
          if [ -e "$py" ]; then realpath "$py"; fi
        done | sort -u | sed 's/^/     /'
        echo "  WARNING: see docs/daily-note.md (Security) — FDA for uvx/Python.app is broad."
        echo "  Then quit Claude Desktop fully (Cmd-Q) and reopen it."
